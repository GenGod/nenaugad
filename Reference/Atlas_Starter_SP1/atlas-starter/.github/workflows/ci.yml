name: Atlas checks
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ATLAS_ENV: test
      DATA_BACKEND: fixture
      LIVE_AI_ENABLED: "false"
      LIVE_SOURCES_ENABLED: "false"
      UPLOADS_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      TEST_DATABASE_URL: postgresql://atlas:atlas_ci_synthetic@127.0.0.1:5432/atlas_starter_test
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_ci_synthetic
          POSTGRES_DB: atlas_starter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_starter_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Require an actual dependency lock
        run: |
          if [ ! -f package-lock.json ]; then
            echo "S0 incomplete: run npm install locally, review and commit the real package-lock.json."
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:db
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
