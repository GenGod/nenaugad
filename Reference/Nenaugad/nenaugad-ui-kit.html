:root{
 --paper:var(--ng-color-bg-canvas);--surface:var(--ng-color-bg-surface);
 --subtle:var(--ng-color-bg-subtle);--ink:var(--ng-color-text-primary);
 --secondary:var(--ng-color-text-secondary);--muted:var(--ng-color-text-muted);
 --blue:var(--ng-color-action-primary);--blue-hover:var(--ng-color-action-hover);
 --blue-soft:var(--ng-color-action-subtle);--line:var(--ng-color-border-subtle);
 --control:var(--ng-color-border-control);--green:var(--ng-color-status-success-text);
 --green-bg:var(--ng-color-status-success-bg);--amber:var(--ng-color-status-review-text);
 --amber-bg:var(--ng-color-status-review-bg);--red:var(--ng-color-status-danger-text);
 --red-bg:var(--ng-color-status-danger-bg);--neutral:var(--ng-color-status-neutral-text);
 --neutral-bg:var(--ng-color-status-neutral-bg);
 --ui:var(--ng-font-ui);--serif:var(--ng-font-editorial);
}
*{box-sizing:border-box}
html{font-size:16px;scroll-padding-top:120px}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.5 var(--ui);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1{font-family:var(--serif);font-size:2.5rem;font-weight:400;line-height:1.2;letter-spacing:-.035em}
h2{font-size:1.75rem;line-height:1.28;font-weight:600;letter-spacing:-.025em}
h3{font-size:1.125rem;line-height:1.45;font-weight:600}
a{color:var(--blue);text-underline-offset:4px}
button,input,select,textarea{font:inherit}
button,a,input,select,summary{touch-action:manipulation}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
h1:focus{outline:none}
button, input, select, textarea{border-radius:10px}
svg.ico{width:20px;height:20px;flex:0 0 auto;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}.secondary{color:var(--secondary)}
.small{font-size:.875rem;line-height:1.45}.caption{font-size:.75rem;line-height:1.35}
.overline{font-size:.75rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;line-height:1.4;color:var(--secondary)}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.035em}
.blue{color:var(--blue)}.money{font-variant-numeric:tabular-nums}
.flow>*+*{margin-top:16px}.flow-lg>*+*{margin-top:24px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.wrap{max-width:1312px;padding:0 32px;margin:auto}
.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border:1px solid transparent;background:transparent;color:var(--ink);font-size:.875rem;line-height:1.4;font-weight:600;text-decoration:none;transition:background 120ms ease,border-color 120ms ease}
.btn.primary{background:var(--blue);color:white}.btn.primary:hover{background:var(--blue-hover)}
.btn.primary:active{background:var(--ng-color-action-pressed)}
.btn.secondary{background:white;border-color:var(--control);color:var(--ink)}
.btn.secondary:hover{background:var(--subtle)}
.btn.tertiary{color:var(--blue)}.btn.tertiary:hover{background:var(--blue-soft)}
.btn.danger{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.btn:disabled{background:var(--neutral-bg);color:var(--neutral);border-color:var(--line)}
.btn.wide{width:100%}.btn.large{min-height:48px;padding:12px 20px;font-size:1rem}
.icon-btn{height:44px;min-width:44px;padding:10px;border:1px solid var(--line);background:white;color:var(--secondary);display:inline-flex;align-items:center;justify-content:center;border-radius:10px}
.icon-btn:hover{border-color:var(--control)}
.icon-btn[aria-pressed=true]{color:var(--blue);background:var(--blue-soft);border-color:var(--blue)}
.icon-btn[aria-pressed=true] .bookmark{fill:currentColor}
.skip{position:fixed;top:-100px;left:16px;z-index:400;background:white;padding:12px}
.skip:focus{top:12px}
.kitbar{background:var(--ink);color:white;padding:8px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:.875rem}
.kitbar .kit-links{display:flex;gap:4px;align-items:center}
.kitbar a{display:inline-flex;min-height:44px;align-items:center;padding:8px 12px;color:white;border-radius:8px;text-decoration:none}
.kitbar a:hover,.kitbar a[aria-current=page]{background:#35415B}
.kitbar select{min-height:44px;border:1px solid #B6BDCD;background:var(--ink);color:white;padding:8px 12px;max-width:250px}
.kitbar :focus-visible{outline-color:white}
.kit-title{font-weight:600;letter-spacing:.03em}
body.preview .kitbar{display:none}
.site-header{height:80px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.header-inner{width:100%;display:flex;align-items:center;gap:48px}
.logo{font-family:var(--serif);font-size:2rem;line-height:1;letter-spacing:-.055em;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:10px}
.logo-mark{width:26px;height:26px;color:var(--blue);display:grid;place-items:center}
.logo-mark svg{width:26px;height:26px}
.site-nav{display:flex;gap:8px;align-items:center}
.site-nav a{color:var(--secondary);text-decoration:none;min-height:44px;padding:10px 14px;display:flex;align-items:center;border-radius:8px;font-size:.875rem}
.site-nav a[aria-current=page]{background:var(--blue-soft);color:var(--blue);font-weight:600}
.header-right{margin-left:auto;display:flex;align-items:center;gap:16px}
.avatar{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);border-radius:50%;font-size:.875rem;background:white}
.tagline{font-size:.75rem;color:var(--secondary);text-transform:uppercase;letter-spacing:.08em}
.page{padding:40px 0 64px}.page-head{margin-bottom:28px}
.page-head p{margin-top:10px;max-width:65ch;color:var(--secondary)}
.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:24px}
.line{border:0;border-top:1px solid var(--line);margin:24px 0}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:5px 8px;font-size:.875rem;line-height:1.35;font-weight:500}
.badge svg{width:16px;height:16px}
.badge.pass{background:var(--green-bg);color:var(--green)}
.badge.review{background:var(--amber-bg);color:var(--amber)}
.badge.fail{background:var(--red-bg);color:var(--red)}
.badge.neutral{background:var(--neutral-bg);color:var(--neutral)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;color:var(--secondary);font-size:.875rem}
.pill{border-radius:999px}
.demo-note{color:var(--secondary);font-size:.875rem;border-top:1px solid var(--line);padding:20px 0 28px}
.hero{display:grid;grid-template-columns:1.08fr 1fr;gap:64px;align-items:center;padding:64px 0 56px}
.hero h1{font-size:4rem;line-height:1.06;letter-spacing:-.045em;margin-top:20px}
.hero h1 em{color:var(--blue);font-weight:400}
.hero p.lead{font-size:1.0625rem;line-height:1.7;color:var(--secondary);max-width:47ch;margin-top:24px}
.hero .actions{margin-top:28px}.hero .privacy{margin-top:16px;color:var(--secondary);display:flex;gap:8px;font-size:.875rem;max-width:49ch}
.proof-shell{position:relative;padding:28px;background:var(--blue-soft);border-radius:20px}
.proof-shell .proof-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;color:var(--blue);font-size:.75rem;letter-spacing:.06em;font-weight:600;text-transform:uppercase}
.proof-card{background:white;border:1px solid #B8C5F2;border-radius:12px;padding:24px}
.company-mark{width:44px;height:44px;background:var(--subtle);display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;font-family:var(--serif);font-size:1.5rem;flex-shrink:0}
.company-mark.fern{background:var(--green-bg);color:var(--green);border-color:#D1E3D7}
.company-mark.river{background:var(--blue-soft);color:var(--blue);border-color:#C8D1F5}
.company-mark.pearl{background:var(--amber-bg);color:var(--amber)}
.proof-card h3{font-size:1.25rem}.proof-card .pay{font-weight:600;margin:20px 0 12px}
.proof-rule{padding:14px 0;border-top:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;font-size:.875rem}
.proof-rule>svg{color:var(--green);margin-top:2px}
.proof-rule strong{font-weight:600;display:block}
.proof-foot{color:var(--secondary);font-size:.875rem;margin-top:16px}
.promise-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:28px 0}
.promise-grid h3{font-size:1rem;margin:10px 0 6px}.promise-grid p{font-size:.875rem;color:var(--secondary)}
.promise-grid>.promise>svg{color:var(--blue)}
.section-space{margin-top:48px}
.results-layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px}
.results-sidebar{font-size:.875rem}
.side-label{padding-top:4px;margin-bottom:20px}
.side-block{padding:20px 0;border-bottom:1px solid var(--line)}
.side-block h3{font-size:.875rem;margin-bottom:12px}
.side-block p{color:var(--secondary);font-size:.875rem;margin-top:6px}
.context{background:var(--blue-soft);border:1px solid #C8D1F5;border-radius:12px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}
.context .context-title{font-size:.875rem;font-weight:600;color:var(--blue)}
.context .context-info{font-size:.875rem;color:var(--secondary);margin-top:3px}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field label{font-size:.875rem;font-weight:600}
input:not([type=checkbox]):not([type=radio]),select,textarea{background:white;border:1px solid var(--control);color:var(--ink);min-height:48px;padding:11px 12px;min-width:0;max-width:100%;font-size:1rem}
input::placeholder,textarea::placeholder{color:var(--muted)}
input[aria-invalid=true]{border:2px solid var(--red)}
textarea{min-height:112px;resize:vertical}
.search-row{display:flex;gap:12px;margin-bottom:20px}
.search-control{flex:1;position:relative;min-width:0}
.search-control>svg{position:absolute;left:14px;top:14px;color:var(--secondary)}
.search-control input{width:100%;padding-left:44px}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:.875rem;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--blue);flex-shrink:0}
.tablist{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:20px;flex-wrap:wrap}

.results-meta{display:flex;justify-content:space-between;align-items:center;font-size:.875rem;color:var(--secondary);gap:12px;margin-bottom:16px}
.job-list{display:flex;flex-direction:column;gap:16px}

.job-top{display:flex;align-items:flex-start;gap:14px}

.job-title-area h3 a{color:var(--ink);text-decoration:none}
.job-title-area h3 a:hover{text-decoration:underline}
.job-card .salary{font-weight:600;margin-top:16px}
.job-card .salary small{font-weight:400;color:var(--secondary);font-size:.875rem}
.job-facts{margin-top:10px;display:flex;gap:16px;flex-wrap:wrap;color:var(--secondary);font-size:.875rem}
.job-facts>span{display:inline-flex;align-items:center;gap:6px}
.job-bottom{border-top:1px solid var(--line);margin-top:16px;padding-top:16px;display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
.job-reason{margin-top:7px;font-size:.875rem;color:var(--secondary)}

details{margin-top:12px}

function icon(name){return `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${icons[name]||icons.info}</svg>`}

function btn(text,action,kind='primary',ico=''){return `<button class="btn ${kind}" data-action="${action}">${ico?icon(ico):''}${text}</button>`}
function link(text,to,kind='primary',ico=''){return `<a class="btn ${kind}" href="#${to}">${text}${ico?icon(ico):''}</a>`}
function badge(kind,text){return `<span class="badge ${kind}">${icon(kind==='pass'?'check':kind==='review'?'question':kind==='fail'?'conflict':'info')}${text}</span>`}

function footer(){return `<footer class="wrap demo-note">Ненаугад 1.3 · Дизайн-концепция. Вакансии, цитаты и профили — демонстрационные; реальный подбор не подключён.</footer>`}
function mobileNav(route){if(route.startsWith('job-')){let j=byId(route.slice(4));return `<div class="mobile-apply">${saveButton(j.id)}${j.status==='closed'?'<button class="btn primary" disabled>Вакансия закрыта</button>':btn('Перейти к отклику','apply','primary','external')}</div>`}return `<nav class="mobile-nav" aria-label="Основная мобильная">${[['results','Вакансии','search'],['saved','Сохранённое','bookmark'],['profile','Профиль','user']].map(([r,t,i])=>`<a href="#${r}" ${r===route?'aria-current="page"':''}>${icon(i)}<span>${t}</span></a>`).join('')}</nav>`}
function pagehead(kicker,title,text=''){return `<div class="page-head">${kicker?`<p class="overline" style="margin:0 0 12px">${kicker}</p>`:''}<h1 tabindex="-1">${title}</h1>${text?`<p>${text}</p>`:''}</div>`}
function proof(){return `<div class="proof-shell"><div class="proof-head"><span>Как выглядит ясность</span><span>Пример</span></div><div class="proof-card">
 <div class="row"><div class="company-mark fern">f</div><div><p class="small secondary">Fern Labs</p><h3>Senior Full-stack Engineer</h3></div></div>
 <p class="pay money">€72 000–90 000 <span class="small secondary">/ год</span></p>
 ${badge('pass','Условия совпадают')}
 <div style="margin-top:20px">
 <div class="proof-rule">${icon('check')}<div><strong>Работайте из Грузии</strong><span class="secondary">Подряд доступен по всему миру</span></div></div>
 <div class="proof-rule">${icon('check')}<div><strong>В вашем рабочем ритме</strong><span class="secondary">Минимум 7 часов пересечения. Нужно 4.</span></div></div>
 <div class="proof-rule">${icon('document')}<div><strong>У каждого вывода есть основание</strong><span class="secondary">Оригинальная формулировка доступна</span></div></div></div></div>
 <p class="proof-foot">По опубликованным условиям и подтверждённому профилю. Не гарантия найма.</p></div>`}
function home(){return `<div class="wrap"><section class="hero"><div><p class="overline">Удалённая работа. Понятные условия.</p><h1 tabindex="-1">Выбирать работу.<br><em>Не наугад.</em></h1><p class="lead">Найдите роль под ваш опыт, страну и рабочие часы. Без переезда и догадок о том, что значит «remote».</p><div class="row actions">${link('Подобрать по резюме','profile','primary large','arrow')}${link('Смотреть вакансии','results','secondary large')}</div><p class="privacy">${icon('lock')}Вы подтвердите профиль перед подбором. Резюме не отправляется работодателям автоматически.</p></div>${proof()}</section>
 <section class="promise-grid" aria-label="Принципы продукта">
 <div class="promise">${icon('globe')}<h3>Удалённо — действительно</h3><p>Без гибрида и обязательных визитов в офис.</p></div>
 <div class="promise">${icon('clock')}<h3>В вашем рабочем ритме</h3><p>Страна найма и рабочие часы — отдельные условия.</p></div>
 <div class="promise">${icon('document')}<h3>Неизвестное не спрятано</h3><p>Каждый вывод можно проверить по источнику.</p></div></section>
 <section class="section-space"><div class="row between"><div><p class="overline">Открытый каталог · примеры</p><h2 class="serif" style="margin-top:8px">Возможности уже здесь</h2></div>${link('Все вакансии','results','tertiary','arrow')}</div><div class="system-grid two" style="margin-top:24px">${jobcard(jobs[0],false)}${jobcard(jobs[1],false)}</div></section></div>`}

function matchedJobs(){
 return jobs.filter(j=>j.fresh)
  .filter(j=>state.mode==='all'||j.status===state.tab)
  .filter(j=>!state.salaryOnly||j.basis)
  .filter(j=>(j.title+' '+j.company+' '+j.skills.join(' ')).toLowerCase().includes(state.query.toLowerCase().trim()));
}
function filteredCount(status){return jobs.filter(j=>j.fresh&&j.status===status).filter(j=>!state.salaryOnly||j.basis).filter(j=>(j.title+' '+j.company+' '+j.skills.join(' ')).toLowerCase().includes(state.query.toLowerCase().trim())).length}
function resultsBody(){let list=matchedJobs();return list.length?list.map(j=>jobcard(j,state.mode==='personal')).join(''):`<div class="empty">${icon('search')}<h2>Пока нет совпадений</h2><p>В демонстрационной выборке нет вакансий с такими фильтрами. Условия работодателей мы не будем менять.</p>${btn('Сбросить фильтры','reset','secondary')}</div>`}

 <div id="result-panel" ${state.mode==='personal'?`role="tabpanel" aria-labelledby="tab-${state.tab}" tabindex="0"`:''}><div class="job-list" id="job-list">${resultsBody()}</div></div>
 </section></div></div>`}
const conds=[
{title:'Страна найма',text:'Грузия разрешена. Работодатель предлагает подряд по всему миру.',quote:'This is a permanent, fully remote contractor role open worldwide.',ref:'Himalayas · синтетическая цитата · версия 23.09.2026'},
{title:'Рабочие часы',text:'Минимум 7 часов пересечения в течение года. Нужно 4 часа.',quote:'At least four hours of overlap with 09:00–17:00 Europe/Berlin, Monday to Friday.',ref:'Пример условия · учтён сезонный переход времени'},

function schedule(){return `<div class="aside-card"><p class="overline">Время без догадок</p><h3 style="margin-top:8px">Общие рабочие часы</h3><div class="schedule-row"><div class="schedule-label"><strong>Вы</strong><span>12:00–20:00</span></div><div class="schedule-track" aria-hidden="true"><span></span></div></div>

function detail(id){const j=byId(id),review=j.status==='review',closed=j.status==='closed';

 cs[0].quote = j.id==='river' ? 'This fully remote contractor role is open to candidates in Georgia and the other countries listed in the posting.' : conds[0].quote;
 cs[0].ref = j.source+' · синтетическая цитата · версия 23.09.2026';
 cs[3].text = j.salary+' в год до налогов. Ваш минимум — €65 000.';

 if(id==='orbit'){cs[3]={title:'Компенсация',text:'Зарплата не опубликована. Сравнить с вашим минимумом пока нельзя.',quote:'Compensation will be discussed during the interview.',ref:'Jobicy · синтетический пример отсутствующей суммы'};}
 return `<div class="wrap page"><a class="btn tertiary" href="#results">${icon('back')}К подборке</a>

 <h1 tabindex="-1" style="margin-top:16px">${j.title}</h1><div class="job-facts"><span>${icon('globe')}${j.geo}</span><span>${icon('briefcase')}${j.contract}</span></div>

 ${review?`<div class="banner review" style="margin-top:20px">${icon('question')}<span><strong>${id==='cedar'?'Нужно уточнить у работодателя':'Нужно уточнить два условия'}</strong><br>${j.reason}. Неизвестное не считается отказом.</span></div>`:''}
 <div class="conditions">${cs.map((c,i)=>condition(c,i,review&&((id==='cedar'&&i===0)||(id==='orbit'&&i===3)))).join('')}</div>

 <div class="section-space"><h2>О роли</h2><div class="prose" style="margin-top:16px"><p>В этом примере команда ищет инженера для развития продукта: интерфейсов, API и инструментов для пользователей. В реальной карточке здесь будет оригинальное описание из разрешённого источника.</p><p style="margin-top:16px">Синтетические данные предназначены для оценки интерфейса. Fern Labs, River Software и другие названия не являются объявлениями реальных работодателей.</p></div></div>

 const save=e.target.closest('[data-save]');
 if(save){let id=save.dataset.save,has=state.saved.has(id);if(has)state.saved.delete(id);else{state.saved.add(id);state.savedStatus[id]||='Планирую'}
 if(currentRoute==='saved'){render(true)}
 else $$(`[data-save="${id}"]`).forEach(b=>{b.setAttribute('aria-pressed',!has);b.setAttribute('aria-label',`${has?'Сохранить вакансию':'Убрать из сохранённого'}: ${byId(id).title}`)});
 $$('[data-saved-count]').forEach(el=>el.textContent=state.saved.size);
 toast(has?'Убрано из сохранённого. Изменение только в демо-сеансе.':'Вакансия сохранена в демо-сеансе. Отклик не отправлен.');
 return}
 const mode=e.target.closest('[data-mode]');if(mode){state.mode=mode.dataset.mode;render(true);$(`[data-mode="${state.mode}"]`).focus();return}
 const tab=e.target.closest('[data-tab]');if(tab){state.tab=tab.dataset.tab;render(true);$(`[data-tab="${state.tab}"]`).focus();announce(`Найдено ${matchedJobs().length} демонстрационных вакансий`);return}
 const ds=e.target.closest('[data-demo-state]');if(ds){state.demoState=ds.dataset.demoState;render(true);$(`[data-demo-state="${state.demoState}"]`).focus();return}
 const action=e.target.closest('[data-action]');if(!action)return;
 switch(action.dataset.action){
 case 'filters':openFilters(action);break;
 case 'cancel':case 'close':closeModal();break;
 case 'apply-filters':
  state.query=$('#filter-query').value;state.salaryOnly=$('#salary-only').checked;
  closeModal();if(currentRoute==='results'){render(true);$('[data-action="filters"]').focus();announce(`Фильтры применены. Найдено ${matchedJobs().length} вакансий`)}else toast('Фильтры настроены для демонстрационной подборки.');
  break;
 case 'reset':state.query='';state.salaryOnly=false;render(true);$('#job-search').focus();break;
 case 'show-review':state.mode='personal';state.tab='review';state.query='';state.salaryOnly=false;location.hash='results';break;
 case 'source':toast('Пример атрибуции. Реальная публикация источника в этом UI-kit не подключена.');break;
 case 'sample':toast('Пример подтверждения действия. Данные не отправлялись на сервер.');break;
 case 'apply':
  openModal('Переход к отклику',`<div class="banner">${icon('external')}<span>Это дизайн-прототип. Здесь нет реальной вакансии и внешняя страница не открывается.</span></div><p class="secondary small" style="margin-top:20px">В продукте эта кнопка откроет разрешённый маршрут источника. Резюме не отправится автоматически, статус «Откликнулся» не изменится.</p>`,`<button class="btn primary" data-action="cancel">Понятно</button>`,action);break;
 case 'resume':
  openModal('Пример извлечённого опыта',`<div class="flow"><p><strong>Senior Full-stack Engineer</strong></p><p class="secondary">Демонстрационный опыт: TypeScript, React, Node.js.</p><div class="banner review">${icon('question')}<span>Уровень английского и право на работу не выводятся из текста. Их нужно подтвердить отдельно.</span></div><p class="small muted">Реального файла нет. Парсер не запускался.</p></div>`,`<button class="btn primary" data-action="cancel">Вернуться к профилю</button>`,action);break;
 case 'delete-demo':
  openModal('Удаление: пример подтверждения',`<p class="secondary">В реальном продукте здесь должны быть названы точный объект и последствия: файл, профиль или аккаунт. Это не взаимозаменяемые операции.</p><div class="banner" style="margin-top:20px">${icon('info')}<span>Данные в этом примере не удаляются.</span></div>`,`<button class="btn secondary" data-action="cancel">Отмена</button><button class="btn danger" data-action="delete-confirm">Подтвердить пример</button>`,action);break;
 case 'delete-confirm':closeModal();toast('Показан сценарий подтверждения. Реального удаления не было.');break;
 }
});
document.addEventListener('input',e=>{if(e.target.id==='job-search'){state.query=e.target.value;updateResults()}});
document.addEventListener('change',e=>{
 if(e.target.id==='view-select'){location.hash=e.target.value;return}
 if(e.target.dataset.userStatus){state.savedStatus[e.target.dataset.userStatus]=e.target.value;toast('Личный статус изменён только в демо-сеансе.')}
});
document.addEventListener('keydown',e=>{
 const t=e.target.closest('[role=tab]');if(!t)return;
 const tabs=$$('[role=tab]',t.closest('[role=tablist]'));let i=tabs.indexOf(t),next=i;
 if(e.key==='ArrowRight')next=(i+1)%tabs.length;else if(e.key==='ArrowLeft')next=(i-1+tabs.length)%tabs.length;else if(e.key==='Home')next=0;else if(e.key==='End')next=tabs.length-1;else return;
 e.preventDefault();tabs[next].click();
});
document.addEventListener('submit',e=>{
 if(e.target.id!=='profile-form')return;e.preventDefault();
 const role=$('#profile-role'),feedback=$('#profile-feedback');
 if(!role.value.trim()){role.setAttribute('aria-invalid','true');role.setAttribute('aria-describedby','profile-feedback');feedback.innerHTML=`<div class="banner danger">${icon('close')}<span>Укажите целевую роль. Остальные значения сохранены в форме.</span></div>`;role.focus();return}
 role.removeAttribute('aria-invalid');role.removeAttribute('aria-describedby');
 feedback.innerHTML=`<div class="banner success">${icon('check')}<span>Пример профиля проверен. Данные никуда не отправлены; реальный подбор и сохранение на сервере не подключены.</span></div>`;
 announce('Демонстрационная проверка завершена');
});
window.addEventListener('hashchange',()=>render());
if(new URLSearchParams(location.search).has('preview'))document.body.classList.add('preview');
render();

document.getElementById('dialog').addEventListener('keydown',e=>{
 if(e.key!=='Tab')return;
 const nodes=Array.from(e.currentTarget.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href],[tabindex="0"]')).filter(el=>el.getClientRects().length);
 if(!nodes.length){e.preventDefault();return}
 const first=nodes[0],last=nodes[nodes.length-1],active=document.activeElement;
 if(e.shiftKey&&active===first){e.preventDefault();last.focus()}
 else if(!e.shiftKey&&active===last){e.preventDefault();first.focus()}
});
</script></body></html>
