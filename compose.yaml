name: nenaugad
services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run npm run setup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup}
      POSTGRES_DB: ${POSTGRES_DB:-atlas_starter}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - nenaugad_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    # Dev convenience (owner decision 2026-09-25): the DB must come back
    # with the Docker engine; manual `docker compose stop db` still works.
    restart: unless-stopped
volumes:
  nenaugad_pgdata:
