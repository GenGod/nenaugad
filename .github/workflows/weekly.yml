name: Weekly checks
on:
  schedule:
    # Mondays 06:00 UTC. A failed scheduled run is emailed by GitHub.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Reads package-lock.json only: nothing is installed or upgraded. High and
      # critical advisories fail the run; lower ones are listed in the log.
      - run: npm audit --audit-level=high
