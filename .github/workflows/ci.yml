name: Nenaugad checks
on:
  # Work lands on main by direct push, so pushes are what CI must verify.
  # A push that only touches Markdown or the archived Reference/ is skipped.
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "Reference/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nenaugad-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ATLAS_ENV: test
  DATA_BACKEND: fixture
  LIVE_AI_ENABLED: "false"
  LIVE_SOURCES_ENABLED: "false"
  UPLOADS_ENABLED: "false"
  NEXT_TELEMETRY_DISABLED: "1"

# Three parallel jobs, one status check each: Code quality, Build, Tests.
jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Before setup-node: its npm cache needs the lock and would fail less clearly.
      - name: Require an actual dependency lock
        run: |
          if [ ! -f package-lock.json ]; then
            echo "S0 incomplete: run npm install locally, review and commit the real package-lock.json."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Biome lint (recommended rules; warnings fail)
        run: npm run lint
      - name: TypeScript strict typecheck
        run: npm run typecheck
      - name: Guardrails, token and icon drift
        run: npm run tokens:check && npm run icons:check && npm run guardrails

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_DATABASE_URL: postgresql://atlas:atlas_ci_synthetic@127.0.0.1:5432/atlas_starter_test
    services:
      postgres:
        # Same image as compose.yaml: migration 0016 creates the pgvector extension.
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_ci_synthetic
          POSTGRES_DB: atlas_starter_test
        ports:
          - 5432:5432
        # Over TCP: the temporary server of the first-boot init answers only on the socket.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U atlas -d atlas_starter_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Unit and DB tests with the coverage ratchet
        # The DB suite exercises the PostgreSQL backend; under the job's fixture
        # backend those services refuse with `fixture_backend`. The tests bring
        # their own pool on TEST_DATABASE_URL, so DATABASE_URL is not needed.
        shell: bash
        env:
          DATA_BACKEND: postgres
        run: npm run -s test:coverage | tee test-coverage.txt
      - name: Test and coverage summary
        if: always()
        shell: bash
        run: |
          [ -f test-coverage.txt ] || exit 0
          {
            echo "### Unit and DB tests"
            echo '```'
            grep -E "^ℹ (tests|pass|fail) |all files|does not meet" test-coverage.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npx playwright install --with-deps chromium
      - name: E2E tests (Playwright needs DB and a session secret)
        env:
          DATABASE_URL: postgresql://atlas:atlas_ci_synthetic@127.0.0.1:5432/atlas_starter_test
          AUTH_SECRET: ci-only-ephemeral-session-secret-not-production
        run: npm run test:e2e
      - name: Keep the Playwright failure output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
