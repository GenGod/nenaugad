name: Nenaugad checks
on:
  # Work lands on main by direct push, so pushes are what CI must verify.
  # A push that only touches Markdown or the archived Reference/ is skipped.
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "Reference/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nenaugad-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ATLAS_ENV: test
  DATA_BACKEND: fixture
  LIVE_AI_ENABLED: "false"
  LIVE_SOURCES_ENABLED: "false"
  UPLOADS_ENABLED: "false"
  NEXT_TELEMETRY_DISABLED: "1"

# Three parallel jobs, one status check each: Code quality, Build, Tests.
# Runners are pinned to ubuntu-24.04: ubuntu-latest moves to Ubuntu 26 from
# 2026-10-19, and the move should be a deliberate change, not a surprise.
jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Before setup-node: its npm cache needs the lock and would fail less clearly.
      - name: Require an actual dependency lock
        run: |
          if [ ! -f package-lock.json ]; then
            echo "S0 incomplete: run npm install locally, review and commit the real package-lock.json."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Biome lint (recommended rules; warnings fail)
        run: npm run lint
      - name: TypeScript strict typecheck
        run: npm run typecheck
      - name: Guardrails, token and icon drift
        run: npm run tokens:check && npm run icons:check && npm run guardrails

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TEST_DATABASE_URL: postgresql://atlas:atlas_ci_synthetic@127.0.0.1:5432/atlas_starter_test
      # The backup and restore tests (DEPLOY-003) call pg_dump and pg_restore from here: the
      # same PGDG package and path as the server (deploy/README.md, Backups).
      PG_BIN_DIR: /usr/lib/postgresql/17/bin
    services:
      postgres:
        # Same image as compose.yaml: migration 0016 creates the pgvector extension.
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas_ci_synthetic
          POSTGRES_DB: atlas_starter_test
        ports:
          - 5432:5432
        # Over TCP: the temporary server of the first-boot init answers only on the socket.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U atlas -d atlas_starter_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: PostgreSQL 17 client from PGDG (DEPLOY-003)
        # postgresql.org/download/linux/ubuntu, manual configuration: the project's signed
        # repository, the key checked against its published fingerprint. Any PGDG entry the
        # runner image carries is removed first, so two Signed-By values cannot conflict.
        shell: bash
        run: |
          set -euo pipefail
          key=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o "$key" https://www.postgresql.org/media/keys/ACCC4CF8.asc
          # grep -c reads to the end: under pipefail, an early exit (grep -q) can fail gpg.
          [ "$(gpg --show-keys --with-colons "$key" | grep -c '^fpr:::::::::B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8:$')" -ge 1 ]
          { grep -rl 'apt.postgresql.org' /etc/apt/sources.list.d/ || true; } | xargs -r sudo rm -f
          # shellcheck source=/dev/null
          . /etc/os-release
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nArchitectures: %s\nSigned-By: %s\n' \
            "$VERSION_CODENAME" "$(dpkg --print-architecture)" "$key" | sudo tee /etc/apt/sources.list.d/pgdg.sources
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends postgresql-client-17
          "$PG_BIN_DIR/pg_dump" --version
          "$PG_BIN_DIR/pg_restore" --version
      - name: Unit and DB tests with the coverage ratchet
        # The DB suite exercises the PostgreSQL backend; under the job's fixture
        # backend those services refuse with `fixture_backend`. The tests bring
        # their own pool on TEST_DATABASE_URL, so DATABASE_URL is not needed.
        shell: bash
        env:
          DATA_BACKEND: postgres
        run: npm run -s test:coverage | tee test-coverage.txt
      - name: Test and coverage summary
        if: always()
        shell: bash
        run: |
          [ -f test-coverage.txt ] || exit 0
          {
            echo "### Unit and DB tests"
            echo '```'
            grep -E "^ℹ (tests|pass|fail) |all files|does not meet" test-coverage.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npx playwright install --with-deps chromium
      - name: E2E tests (Playwright needs DB and a session secret)
        env:
          DATABASE_URL: postgresql://atlas:atlas_ci_synthetic@127.0.0.1:5432/atlas_starter_test
          AUTH_SECRET: ci-only-ephemeral-session-secret-not-production
        run: npm run test:e2e
      - name: Keep the Playwright failure output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
